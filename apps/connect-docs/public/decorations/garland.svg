<svg xmlns="http://www.w3.org/2000/svg" width="96" height="48" viewBox="0 0 96 48">
  <!-- Guirlanda de pinheiro "pendurada": faixa preenchida e contínua (tileable a cada 96px), com a
       linha dourada do "fio" já embutida no topo do tile (evita depender de box-shadow/border no
       contêiner, que cortava a decoração em caixas com overflow:hidden). -->
  <rect x="0" y="0" width="96" height="3" fill="#D49C0B" />
  <path d="M0 3 L96 3 L96 10 C80 10 80 28 48 28 C16 28 16 10 0 10 Z" fill="#216A3E" />
  <path d="M0 3 L96 3 L96 8 C80 8 80 14 48 14 C16 14 16 8 0 8 Z" fill="#2E8A52" opacity="0.55" />
  <circle cx="20" cy="12" r="2" fill="#D49C0B" />
  <circle cx="76" cy="12" r="2" fill="#D49C0B" />
  <line x1="48" y1="28" x2="48" y2="36" stroke="#D49C0B" stroke-width="2" />
  <circle cx="48" cy="41" r="5.6" fill="#C03B2A" stroke="#8A2A1E" stroke-width="1" />
  <circle cx="46" cy="38.6" r="1.2" fill="#FFF4F2" opacity="0.8" />
