name: Docs (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; um push novo cancela o build anterior ainda em andamento
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Testes das bibliotecas (React, Vue e Connect)
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build do docs (exemplos React e Vue)
        run: npm run build -w docs
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Build do docs do Connect (em /connect/)
        run: npm run build -w connect-docs
        env:
          BASE_PATH: /${{ github.event.repository.name }}/connect/

      - name: Junta os dois sites
        run: node scripts/merge-connect-docs.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
